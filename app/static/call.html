<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Talk to Voicebot</title>
  <link rel="stylesheet" href="/static/call.css" />
</head>
<body>
  <div class="call-shell">
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme" type="button">🌙</button>

    <div class="status-pill" id="statusPill">Idle</div>

    <div class="orb-wrap" id="orbWrap" data-state="idle">
      <svg width="199" height="199" viewBox="0 0 199 199" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M99.3999 197.4C153.524 197.4 197.4 153.524 197.4 99.4004C197.4 45.2765 153.524 1.40039 99.3999 1.40039C45.276 1.40039 1.3999 45.2765 1.3999 99.4004C1.3999 153.524 45.276 197.4 99.3999 197.4Z" fill="url(#paint0_linear_719_63)"/>
        <mask id="mask0_719_63" style="mask-type:luminance" maskUnits="userSpaceOnUse" x="1" y="1" width="197" height="197">
          <path d="M99.3999 197.4C153.524 197.4 197.4 153.524 197.4 99.4004C197.4 45.2765 153.524 1.40039 99.3999 1.40039C45.276 1.40039 1.3999 45.2765 1.3999 99.4004C1.3999 153.524 45.276 197.4 99.3999 197.4Z" fill="white"/>
        </mask>
        <g id="orbFlow" mask="url(#mask0_719_63)">
          <path opacity="0.4" d="M-12.6001 127.404C34.0666 71.4043 80.7332 71.4043 127.4 127.404C174.067 183.404 211.4 174.071 239.4 99.4043" stroke="white" stroke-width="14"/>
          <path opacity="0.6" d="M-40.6001 85.406C34.0666 141.406 99.3999 136.739 155.4 71.406C211.4 6.0727 239.4 24.7394 239.4 127.406" stroke="white" stroke-width="8.4"/>
          <path opacity="0.1" d="M61.5998 197.4C115.724 197.4 159.6 153.524 159.6 99.4004C159.6 45.2765 115.724 1.40039 61.5998 1.40039C7.47594 1.40039 -36.4001 45.2765 -36.4001 99.4004C-36.4001 153.524 7.47594 197.4 61.5998 197.4Z" fill="white"/>
        </g>
        <path opacity="0.5" d="M99.3999 197.4C153.524 197.4 197.4 153.524 197.4 99.4004C197.4 45.2765 153.524 1.40039 99.3999 1.40039C45.276 1.40039 1.3999 45.2765 1.3999 99.4004C1.3999 153.524 45.276 197.4 99.3999 197.4Z" stroke="white" stroke-width="2.8"/>
        <defs>
          <linearGradient id="paint0_linear_719_63" x1="-40.6001" y1="-40.5996" x2="239.4" y2="239.4" gradientUnits="userSpaceOnUse">
            <stop stop-color="#FA8BFF"/>
            <stop offset="0.52" stop-color="#2BD2FF"/>
            <stop offset="1" stop-color="#2BFF88"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <div class="control-pill" id="controlPill">
      <button class="control-btn start-call" id="startCallBtn" type="button">Start Call</button>
    </div>

    <aside class="drawer" id="drawer" data-open="false">
      <div class="transcript-view" id="transcriptView">
        <h3>Transcript</h3>
        <div id="transcriptMessages"></div>
      </div>
      <div class="feedback-view" id="feedbackView" style="display:none">
        <h3>How was the call?</h3>
        <div class="rating-row" id="ratingRow">
          <button class="rating-option" data-value="1" type="button">😞</button>
          <button class="rating-option" data-value="2" type="button">🙁</button>
          <button class="rating-option" data-value="3" type="button">😐</button>
          <button class="rating-option" data-value="4" type="button">🙂</button>
          <button class="rating-option" data-value="5" type="button">😄</button>
        </div>
        <p>Was your issue resolved?</p>
        <div class="resolved-row" id="resolvedRow">
          <button class="resolved-option" data-value="true" type="button">Yes</button>
          <button class="resolved-option" data-value="false" type="button">No</button>
        </div>
        <textarea id="feedbackComment" placeholder="Anything else you'd like to add? (optional)"></textarea>
        <button class="submit-btn" id="submitFeedbackBtn" type="button">Submit</button>
        <button class="skip-btn" id="skipFeedbackBtn" type="button">Skip</button>
      </div>
    </aside>
  </div>

  <script type="module" src="/static/call/call-app.js"></script>
</body>
</html>
